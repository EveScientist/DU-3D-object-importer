# Run the converter on your PC alongside the DU server container.
#   docker compose up -d --build      # build + start, http://localhost:5002
#   docker compose logs -f            # watch conversions
#   docker compose down               # stop
services:
  objtodu:
    build: .
    image: objtodu:latest
    container_name: objtodu
    ports:
      - "5002:5002"
    environment:
      # Raise/lower to match your PC's RAM. 134217728 = 512^3, the largest grid the
      # web UI's max_grid field will ever request (~8.6 GB peak per conversion).
      OBJTODU_MAX_VOXELS: "134217728"
    # Hard cap so a runaway conversion can't take the whole PC down (the OOM lesson
    # from the shared server). Measured peak at grid 512 is ~15.3GB single-threaded;
    # the parallel emitter (OBJTODU_WORKERS, obj_pipeline.py) adds a bit more per worker,
    # so 40g gives real margin on a 128GB host while still catching a genuine runaway.
    mem_limit: 40g
    restart: unless-stopped
